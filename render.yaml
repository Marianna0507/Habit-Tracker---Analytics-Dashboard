# Render Blueprint - deploys all three pieces together.
# Docs: https://render.com/docs/blueprint-spec (verify field names there if
# Render's dashboard rejects anything below - this file is written against
# the documented spec but has NOT been deployed/tested against a live
# Render account, unlike everything else in this repo. See DEPLOY.md.

databases:
  - name: habit-tracker-db
    databaseName: habit_tracker
    user: habit_user
    plan: free

services:
  - type: web
    name: habit-tracker-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: habit-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Render's private networking resolves other services in the same
      # project by their `name` below - mirrors docker-compose.yml's
      # http://analytics:8000 pattern. If you rename the analytics service,
      # update this to match.
      - key: PYTHON_ANALYTICS_URL
        value: http://habit-tracker-analytics:8000
      - key: PORT
        value: 3000

  - type: web
    name: habit-tracker-analytics
    env: docker
    dockerfilePath: ./analytics/Dockerfile
    dockerContext: ./analytics
    plan: free
    envVars:
      # Render's managed Postgres only gives you the admin connection
      # string via fromDatabase - there's no Blueprint mechanism to
      # provision the read-only analytics_reader role automatically.
      # Set this manually after creating the analytics_reader role
      # (see DEPLOY.md) - same host/port/db as DATABASE_URL above, just a
      # different user.
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 8000
