databases:
  - name: habit-tracker-db
    databaseName: habit_tracker
    user: habit_user
    plan: free

services:
  - type: web
    name: habit-tracker-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: habit-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PYTHON_ANALYTICS_URL
        value: http://habit-tracker-analytics:8000
      - key: PORT
        value: 3000

  - type: web
    name: habit-tracker-analytics
    env: docker
    dockerfilePath: ./analytics/Dockerfile
    dockerContext: ./analytics
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 8000
